            background-color: #FFFDF0;
            color: #451A03;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Floating Animation for Result Emoji */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Fade and slide transitions */
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Soft warm shadow effects */
        .shadow-warm {
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.12), 0 8px 10px -6px rgba(245, 158, 11, 0.08);
        }

        .shadow-warm-hover:hover {
            box-shadow: 0 14px 28px -4px rgba(245, 158, 11, 0.22), 0 10px 12px -4px rgba(245, 158, 11, 0.12);

        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        }

                    "지금 이 순간을 신나게 즐기며 구김살 없는 미소와 위트로 웃음을 선물해요.",
                    "어색한 분위기도 금세 사르르 녹여내는 사람 끌리는 밝은 호감형 인물입니다."

        let currentSelectedMBTI = null;

        // Initialize UI Grid on Page Load
        window.onload = function() {
            renderMBTIGrid('ALL');
        };

        // Render MBTI Grid Buttons based on Filter
        function renderMBTIGrid(filter) {
            const gridContainer = document.getElementById('mbti-grid');
            gridContainer.innerHTML = '';

            Object.keys(pokemonMBTI).forEach(mbti => {
                const data = pokemonMBTI[mbti];
                if (filter !== 'ALL' && data.groupType !== filter) {
                    return;
                }

                const button = document.createElement('button');
                button.onclick = () => selectMBTI(mbti);
                button.className = `
                    bg-white hover:bg-amber-50 active:bg-amber-100 
                    border-2 border-amber-200/90 hover:border-amber-400 
                    rounded-2xl p-4 text-center transition-all duration-200 
                    shadow-warm shadow-warm-hover flex flex-col items-center justify-between group
                `;

                button.innerHTML = `
                    <div class="w-full flex justify-between items-center mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 group-hover:bg-amber-200 transition-colors">
                            ${data.groupType}
                        </span>
                        <span class="text-xl transform group-hover:scale-125 transition-transform duration-200">${data.emoji}</span>
                    </div>
                    <div class="my-1">
                        <span class="block text-2xl font-black text-amber-950 tracking-wide group-hover:text-amber-600 transition-colors">${mbti}</span>
                        <span class="block text-xs font-bold text-amber-700 mt-0.5">${data.name}</span>
                    </div>
                    <div class="mt-2 w-full pt-2 border-t border-amber-100 text-[11px] text-amber-800/80 font-medium truncate">
                        ${data.subtitle}
                    </div>
                `;

                gridContainer.appendChild(button);
            });
        }

        // Handle Filter Button Clicks
        function filterMBTI(group) {
            // Update filter button visuals
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.classList.remove('bg-amber-400', 'text-amber-950', 'shadow-sm', 'font-bold');
                btn.classList.add('bg-amber-100/70', 'text-amber-900', 'font-semibold');
            });

            event.target.classList.remove('bg-amber-100/70', 'text-amber-900', 'font-semibold');
            event.target.classList.add('bg-amber-400', 'text-amber-950', 'shadow-sm', 'font-bold');

            renderMBTIGrid(group);
        }

        // Show Result Screen for selected MBTI
        function selectMBTI(mbti) {
            currentSelectedMBTI = mbti;
            const data = pokemonMBTI[mbti];

            // Fill Result Fields
            document.getElementById('result-group').innerText = data.group;
            document.getElementById('result-mbti-badge').innerText = mbti;
            document.getElementById('result-emoji').innerText = data.emoji;
            document.getElementById('result-subtitle').innerText = data.subtitle;
            document.getElementById('result-pokemon').innerText = data.name;

            // Fill Description List
            const descList = document.getElementById('result-desc-list');
            descList.innerHTML = '';
            data.desc.forEach(text => {
                const li = document.createElement('li');
                li.className = 'flex items-start gap-2';
                li.innerHTML = `<span class="text-amber-500 font-bold">•</span> <span>${text}</span>`;
                descList.appendChild(li);
            });

            // Fill Best Match Info
            document.getElementById('match-mbti').innerText = data.bestMatch;
            document.getElementById('match-pokemon').innerText = data.bestPokemon;
            document.getElementById('match-reason').innerText = data.bestReason;

            // Switch views smoothly
            const selectionSection = document.getElementById('selection-section');
            const resultSection = document.getElementById('result-section');

            selectionSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            // Scroll smoothly to top of result
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset to Selection View
        function resetSelection() {
            currentSelectedMBTI = null;
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('selection-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Copy Result Summary to Clipboard
        function copyResultToClipboard() {
            if (!currentSelectedMBTI) return;
            const data = pokemonMBTI[currentSelectedMBTI];

            const shareText = `[MBTI로 포켓몬 찾기] 🐾\n나의 MBTI (${currentSelectedMBTI})에 딱 맞는 포켓몬은 바로 '${data.name} ${data.emoji}'입니다!\n\n✨ 환상의 짝꿍 MBTI: ${data.bestMatch} (${data.bestPokemon})\n나와 닮은 포켓몬을 확인해보세요!`;

            // Reliable clipboard fallback for embedded iframe environments
            const textArea = document.getElementById('clipboard-area');
            textArea.value = shareText;
            textArea.classList.remove('hidden');
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('결과가 클립보드에 복사되었습니다! 📋');
                } else {
                    showToast('복사에 실패했습니다. 직접 텍스트를 선택해 주세요.');
                }
            } catch (err) {
                showToast('클립보드 복사를 지원하지 않는 브라우저입니다.');
            } finally {
                textArea.classList.add('hidden');
            }
        }

        // Show Toast Notification Message
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = msg;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2600);
        }
    </script>
